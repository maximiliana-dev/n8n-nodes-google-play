# Publishes the package to npm with a provenance attestation (required by n8n
# for verified community nodes since May 1 2026).
#
# Release process: bump the version in package.json, update the changelog and
# push to master. The version in package.json is the trigger: the package is
# published only when that version is not on npm yet, so ordinary pushes (and
# re-runs) publish nothing. Running the workflow by hand publishes whatever the
# branch holds, and fails if that version is already published.
#
# Auth: OIDC trusted publishing (configure this repository + publish.yml as a
# Trusted Publisher in the npm package settings), with an optional NPM_TOKEN
# secret as fallback.

name: Publish

on:
  push:
    branches:
      - master
    paths:
      - package.json
  workflow_dispatch:

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already on npm?
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" != 'push' ]; then
            echo "Manual run: publishing $name@$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Empty output covers both "this version does not exist" and "the
          # package does not exist yet"; a non-empty one means it is published.
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "$name@$version is already published, nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on npm, publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Required to mint an OIDC token for npm provenance attestation
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Pinned npm (>=11.5.1 needed for the OIDC trusted-publishing token
      # exchange; the npm bundled with Node 22 is too old). RELEASE_MODE lets
      # the prepublishOnly guard (n8n-node prerelease) pass: it exists to block
      # accidental npm publishes outside this workflow.
      - name: Publish to npm
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npx -y npm@12.0.2 publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: 'true'
